services:
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
      - mosquitto-data:/mosquitto/data

  backend:
    build:
      context: .
      dockerfile: crates/growntrol-backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - broker
    environment:
      GROWNTROL_BIND: 0.0.0.0:8080
      GROWNTROL_MQTT_HOST: broker
      GROWNTROL_MQTT_PORT: 1883
      RUST_LOG: growntrol_backend=info,tower_http=info
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ${GROWNTROL_WEB_CONTEXT:-../growntrol-web}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  simulator:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: crates/growntrol-simulator/Dockerfile
    restart: unless-stopped
    depends_on:
      - broker
    environment:
      GROWNTROL_DEVICE_ID: demo-grow-1
      GROWNTROL_MQTT_HOST: broker
      GROWNTROL_MQTT_PORT: 1883

volumes:
  mosquitto-data:
