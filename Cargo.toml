[workspace]
members = [
    "crates/growntrol-core",
    "crates/growntrol-protocol",
    "crates/growntrol-backend",
    "crates/growntrol-simulator",
]
exclude = ["crates/growntrol-firmware"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
